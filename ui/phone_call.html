<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>BUDDY VOICE CALL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            background-color: #000000;
            color: #d0e2f5;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px;
            position: relative;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            letter-spacing: 3px;
            color: #00f3ff;
            text-align: center;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
            margin-top: 10px;
        }

        .call-status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            color: #ffb700;
            margin-top: 6px;
            text-align: center;
        }

        .call-timer {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-top: 6px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        /* INCOMING CALL OVERLAY */
        .incoming-call-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 4, 8, 0.98);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 60px 20px;
        }

        .incoming-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #00f3ff 60%, rgba(0,0,0,0.8) 100%);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.8);
            animation: ringPulse 1s infinite alternate;
        }

        @keyframes ringPulse {
            0% { transform: scale(0.92); box-shadow: 0 0 30px rgba(0, 243, 255, 0.4); }
            100% { transform: scale(1.1); box-shadow: 0 0 70px rgba(0, 243, 255, 0.9); }
        }

        .incoming-caller-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            margin-top: 20px;
        }

        .incoming-caller-sub {
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            color: #00f3ff;
            margin-top: 8px;
        }

        .incoming-actions {
            display: flex;
            gap: 40px;
            width: 100%;
            max-width: 300px;
        }

        .ring-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            font-size: 30px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .ring-btn-accept { background: #00ff9d; color: #000; box-shadow: 0 0 30px rgba(0, 255, 157, 0.6); }
        .ring-btn-decline { background: #ff2a5f; color: #fff; box-shadow: 0 0 30px rgba(255, 42, 95, 0.6); }
        .ring-btn:active { transform: scale(0.9); }

        /* CENTRAL GLOWING AUDIO CALL ORB */
        .orb-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.3);
            animation: pulseGlow 2s infinite ease-in-out;
            pointer-events: none;
        }

        .audio-orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #00f3ff 40%, rgba(0, 243, 255, 0.1) 80%, rgba(0, 0, 0, 0) 100%);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.8), 0 0 80px rgba(0, 243, 255, 0.3);
            transition: transform 0.15s ease-out;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.4; }
            50% { transform: scale(1.15); opacity: 0.9; }
            100% { transform: scale(0.95); opacity: 0.4; }
        }

        .speech-transcript {
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            color: #00f3ff;
            text-align: center;
            width: 100%;
            max-width: 360px;
            min-height: 52px;
            padding: 12px;
            background: rgba(0, 243, 255, 0.06);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            margin-bottom: 16px;
            word-break: break-word;
        }

        .mobile-input-row {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 16px;
        }

        .mobile-input-box {
            flex: 1;
            background: rgba(10, 15, 25, 0.9);
            border: 1px solid #00f3ff;
            border-radius: 6px;
            padding: 12px 14px;
            color: #00f3ff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            outline: none;
            user-select: text;
        }

        .controls-row {
            display: flex;
            gap: 14px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 20px;
        }

        .call-btn {
            flex: 1;
            min-height: 52px;
            border-radius: 30px;
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 10;
        }

        .btn-talk {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .btn-end {
            background: #ff2a5f;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.5);
        }

        .btn-talk:active { transform: scale(0.95); }
        .btn-end:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- INCOMING PHONE CALL OVERLAY SCREEN -->
    <div class="incoming-call-overlay" id="incomingOverlay" style="display: none;">
        <div style="text-align: center;">
            <div class="incoming-avatar"></div>
            <div class="incoming-caller-name">BUDDY AI</div>
            <div class="incoming-caller-sub">INCOMING VOICE PHONE CALL...</div>
        </div>

        <div class="incoming-actions">
            <button class="ring-btn ring-btn-decline" onclick="declineCall()">✕</button>
            <button class="ring-btn ring-btn-accept" onclick="acceptCall()">📞</button>
        </div>
    </div>

    <div>
        <div class="header-title">BUDDY AI VOICE PHONE CALL</div>
        <div class="call-status" id="callStatus">CONNECTED • VOICE ACTIVE</div>
        <div class="call-timer" id="timer">00:00</div>
    </div>

    <div class="orb-wrapper">
        <div class="pulse-ring" id="pulseRing"></div>
        <div class="audio-orb" id="orb" onclick="startMobileVoiceInput()"></div>
    </div>

    <div class="speech-transcript" id="transcript">
        Tap "MIC VOICE INPUT" or type below to talk...
    </div>

    <div class="mobile-input-row">
        <input type="text" class="mobile-input-box" id="mobileTxt" placeholder="TYPE PHONE MESSAGE..." onkeydown="if(event.key==='Enter') sendTextMsg()">
        <button class="call-btn btn-talk" style="flex:0 0 80px; border-radius:6px; min-height:44px;" onclick="sendTextMsg()">SEND</button>
    </div>

    <div class="controls-row">
        <button class="call-btn btn-talk" id="talkBtn" onclick="startMobileVoiceInput()">
            🎤 MIC VOICE INPUT
        </button>
        <button class="call-btn btn-end" onclick="endPhoneCall()">
            🔴 END CALL
        </button>
    </div>

    <script>
        let audioCtx = null;
        let ringInterval = null;

        function playTelephoneRingtone() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const playRingBurst = () => {
                    const osc1 = audioCtx.createOscillator();
                    const osc2 = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc1.frequency.value = 440;
                    osc2.frequency.value = 480;

                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc1.start();
                    osc2.start();
                    osc1.stop(audioCtx.currentTime + 1.8);
                    osc2.stop(audioCtx.currentTime + 1.8);
                };

                playRingBurst();
                ringInterval = setInterval(playRingBurst, 3000);
            } catch(e) {}
        }

        function stopTelephoneRingtone() {
            if (ringInterval) {
                clearInterval(ringInterval);
                ringInterval = null;
            }
        }

        function triggerIncomingPhoneCall() {
            document.getElementById('incomingOverlay').style.display = 'flex';
            playTelephoneRingtone();
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('autocall') === 'true') {
            triggerIncomingPhoneCall();
        }

        function acceptCall() {
            stopTelephoneRingtone();
            document.getElementById('incomingOverlay').style.display = 'none';
            speakPhoneOutput("Hello Boss! I am online on your phone call bridge. How can I assist you today?");
        }

        function declineCall() {
            stopTelephoneRingtone();
            document.getElementById('incomingOverlay').style.display = 'none';
        }

        let seconds = 0;
        let timerInterval = setInterval(() => {
            seconds++;
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${mins}:${secs}`;
        }, 1000);

        let recognition = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                document.getElementById('callStatus').textContent = 'LISTENING TO PHONE MIC...';
                document.getElementById('callStatus').style.color = '#00f3ff';
                document.getElementById('orb').style.transform = 'scale(1.25)';
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('transcript').textContent = `YOU: "${text}"`;
                sendPhoneVoiceCommand(text);
            };

            recognition.onerror = () => {
                document.getElementById('callStatus').textContent = 'CONNECTED • VOICE ACTIVE';
                document.getElementById('callStatus').style.color = '#ffb700';
                document.getElementById('orb').style.transform = 'scale(1.0)';
            };

            recognition.onend = () => {
                document.getElementById('orb').style.transform = 'scale(1.0)';
            };
        }

        function startMobileVoiceInput() {
            if (recognition) {
                try { recognition.start(); } catch(err) {}
            } else {
                const text = prompt("Speak or type your message to Buddy:");
                if (text) sendPhoneVoiceCommand(text);
            }
        }

        function sendTextMsg() {
            const box = document.getElementById('mobileTxt');
            const val = box.value.trim();
            if (!val) return;
            document.getElementById('transcript').textContent = `YOU: "${val}"`;
            sendPhoneVoiceCommand(val);
            box.value = '';
        }

        function speakPhoneOutput(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/```[\s\S]*?```/g, "Master prompt created.").replace(/`[^`]+`/g, "");
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.rate = 1.05;

                utterance.onstart = () => {
                    document.getElementById('callStatus').textContent = 'BUDDY SPEAKING TO PHONE...';
                    document.getElementById('callStatus').style.color = '#00ff9d';
                    document.getElementById('orb').style.transform = 'scale(1.35)';
                };

                utterance.onend = () => {
                    document.getElementById('callStatus').textContent = 'CONNECTED • VOICE ACTIVE';
                    document.getElementById('callStatus').style.color = '#ffb700';
                    document.getElementById('orb').style.transform = 'scale(1.0)';
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        function sendPhoneVoiceCommand(cmd) {
            fetch('/api/command', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({command: cmd})
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('transcript').textContent = `BUDDY: "${data.response}"`;
                speakPhoneOutput(data.response);
            })
            .catch(err => {
                document.getElementById('transcript').textContent = "Connection error with core server.";
            });
        }

        function endPhoneCall() {
            stopTelephoneRingtone();
            clearInterval(timerInterval);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.body.innerHTML = `
                <div style="margin: auto; text-align: center;">
                    <div style="font-family: 'Orbitron'; font-size: 18px; color: #ff2a5f;">CALL TERMINATED</div>
                    <div style="font-family: 'Share Tech Mono'; margin-top: 10px; color: #888;">Duration: ${document.getElementById('timer').textContent}</div>
                    <button style="margin-top: 20px; padding: 12px 24px; background: #00f3ff; border: none; font-family: 'Orbitron'; border-radius: 4px;" onclick="location.reload()">RECONNECT CALL</button>
                </div>
            `;
        }
    </script>
</body>
</html>
